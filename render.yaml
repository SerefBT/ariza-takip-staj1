services:
  - type: web
    name: ariza-takip
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.1
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: yonetici
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://localhost,http://localhost,capacitor://localhost
